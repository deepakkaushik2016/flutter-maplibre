name: maplibre_example
description: "An example app for the MapLibre flutter wrapper."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.13.0
  flutter: ">=3.47.0"

resolution: workspace

dependencies:
  flutter: { sdk: flutter }
  flutter_web_plugins: { sdk: flutter }
  geolocator: ^14.0.2
  go_router: ^18.0.0
  http: ^1.2.2
  maplibre: ^0.4.0-pre.2
  maplibre_geolocator: ^0.1.0-pre.1

dev_dependencies:
  # darwin_texture_test.dart drives the iOS and macOS plugin's C API.
  ffi: ^2.1.4
  flutter_launcher_icons: ^0.14.3
  flutter_test: { sdk: flutter }
  integration_test: { sdk: flutter }
  maplibre_native: ^0.4.0-pre.2
  # still_image_native.dart renders still images below the public API.
  maplibre_native_ffi:
    git:
      url: https://github.com/deepakkaushik2016/maplibre-native-ffi
      ref: terrain-3d-202611.7
      path: bindings/dart
  very_good_analysis: ^10.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/styles/
    - assets/geojson/
    - assets/tiles/
    - assets/terrain/
    - assets/terrain/alps/10/543/
    - assets/terrain/alps/10/544/
    - assets/terrain/alps/10/545/

flutter_launcher_icons:
  android: "ic_launcher"
  ios: true
  image_path: "../doc/logo.png"
  min_sdk_android: 21
  web:
    generate: true
    image_path: "../doc/logo.png"
    background_color: "#285DAA"
    theme_color: "#285DAA"