name: flutter_maplibre
description: "Pub workspace package for Flutter MapLibre."
version: 1.0.0
repository: https://github.com/josxha/flutter-maplibre
issue_tracker: https://github.com/josxha/flutter-maplibre/issues
homepage: https://josxha.github.io/flutter-maplibre
documentation: https://josxha.github.io/flutter-maplibre/docs/

publish_to: none
environment:
  sdk: ^3.12.0

workspace:
  - examples
  - packages/maplibre
  - packages/maplibre_geolocator
  - packages/maplibre_native
  - packages/maplibre_platform_interface
  - packages/maplibre_web

dev_dependencies:
  pub_semver: ^2.2.0
  yaml: ^3.1.2
  args: ^2.7.0

# The build hook of maplibre_native_ffi downloads the C library for each
# target and picks its render backend: OpenGL ES on Android, Metal on iOS and
# macOS, Vulkan on Windows and Linux. maplibre_native renders through whichever
# one it got. To render through Vulkan on Android, select it under backend:
# android: vulkan. To use a local build of maplibre-native-ffi, name its CMake
# build root (holding <preset>/install for each target) in local_build; see
# CONTRIBUTING.md.
#
# The binding comes from the terrain fork of maplibre-native-ffi, by git, so its
# hook has to fetch the C library from that fork's releases: the default host
# has no terrain release. Only the root pubspec of the app or workspace is read,
# so examples/ takes this setting from here.
hooks:
  user_defines:
    maplibre_native_ffi:
      release_url: https://github.com/deepakkaushik2016/maplibre-native-ffi/releases/download
